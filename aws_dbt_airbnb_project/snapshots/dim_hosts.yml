snapshots:
    - name: dim_hosts
      relation: ref('hosts')
      config:
        schema: gold
        database: AIRBNB
        unique_key: HOST_ID
        strategy: timestamp
        updated_at: HOST_CREATED_AT
        dbt_valid_to_current: "to_date('9999-12-31 23:59:59.999999', 'YYYY-MM-DD HH24:MI:SS.FF')"